# Base44 development compose for 400faqs.
# Runs the app from the bind-mounted source with live-reload dev servers.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: 400faqs
      POSTGRES_PASSWORD: 400faqs
      POSTGRES_DB: 400faqs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 400faqs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: install all workspace deps, generate the Prisma client, and
  # compile the shared @400faqs/db package (its `main` points at dist/).
  setup:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://400faqs:400faqs@postgres:5432/400faqs
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "[ -f node_modules/.base44-setup-done ] || (npm install && npx prisma generate --schema packages/db/prisma/schema.prisma && npm run build --workspace @400faqs/db && touch node_modules/.base44-setup-done)"

  # One-shot: apply migrations + seed the admin user + default settings.
  migrate:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://400faqs:400faqs@postgres:5432/400faqs
      - ADMIN_EMAIL=admin@400faqs.com
      - ADMIN_PASSWORD=admin1234
      - ADMIN_NAME=Super Admin
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push --schema packages/db/prisma/schema.prisma --accept-data-loss && npm run db:seed"

  api:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://400faqs:400faqs@postgres:5432/400faqs
      - REDIS_URL=redis://redis:6379
      - REDIS_REQUIRED=true
      - JWT_SECRET=base44-dev-jwt-secret-9f3c7a1e5b2d8e4a6c0f1b3d5e7a9c2f
      - JWT_EXPIRES_IN=7d
      - ADMIN_EMAIL=admin@400faqs.com
      - ADMIN_PASSWORD=admin1234
      - ADMIN_NAME=Super Admin
      - API_URL=https://4000-${BASE44_PUBLIC_HOST_SUFFIX}
      - WEB_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - CORS_ORIGINS=
      - WORKER_PROCESS=0
      - MAINTENANCE_MODE=false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: npm run dev:api
    ports:
      - "4000:4000"

  web:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=https://4000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_WEB_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_PUBLIC_SITE_NAME=400faqs
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api:
        condition: service_started
    command: npm run dev --workspace @400faqs/web -- -p 3000 -H 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  node_modules:
